;gap:12px}.row img{width:65px;height:65px}.row h3,.value{font-size:19px}.notice{font-size:18px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.results.animate .fill{transform:scaleX(var(--ratio))}}

const $=id=>document.getElementById(id),KEY='bilim-baspaldagy-v1';let history=[],sound=true,ready=false,audio=null,toastTimer,savePending=false;const last=[-Infinity,-Infinity,-Infinity],pulseTimers=[];
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.history)&&s.history.every(x=>Number.isInteger(x)&&x>=0&&x<3))history=s.history;if(typeof s?.sound==='boolean')sound=s.sound}catch(e){}
function counts(){const c=[0,0,0];for(const i of history)c[i]++;return c}
function percentages(c){const n=c.reduce((a,b)=>a+b,0);return c.map(v=>n?v/n*100:0)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({history,sound}))}catch(e){}}
function queueSave(){if(savePending)return;savePending=true;queueMicrotask(()=>{savePending=false;save()})}
function initAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){}}
function play(){if(!sound||!audio)return;const ring=()=>{if(audio.state!=='running')return;try{const t=audio.currentTime;[659.25,880].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),at=t+i*.08;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.05,at+.014);g.gain.exponentialRampToValueAtTime(.0001,at+.15);o.connect(g);g.connect(audio.destination);o.start(at);o.stop(at+.16)})}catch(e){}};if(audio.state==='suspended'){try{audio.resume().then(ring).catch(()=>{})}catch(e){}}else ring()}
function updateSound(){$('sound').textContent=sound?'♪ Дыбыс қосулы':'♪ Дыбыс өшірулі';$('sound').setAttribute('aria-pressed',String(sound))}
function sync(){const c=counts(),p=percentages(c);c.forEach((n,i)=>{$('count'+i).textContent=n;$('card'+i).setAttribute('aria-label',LEVELS[i].title+'. '+LEVELS[i].desc+'. Таңдағандар: '+n);$('value'+i).textContent=n+' оқушы · '+p[i].toFixed(1).replace('.',',')+'%';$('fill'+i).style.setProperty('--ratio',p[i]/100);$('track'+i).setAttribute('aria-label',LEVELS[i].title+': '+n+' оқушы, '+p[i].toFixed(1).replace('.',',')+'%')});$('total').textContent=$('resultTotal').textContent='Барлығы: '+history.length+' жауап';$('empty').hidden=history.length>0;$('undo').disabled=history.length===0;if(!$('results').hidden){$('results').classList.remove('animate');void $('results').offsetWidth;$('results').classList.add('animate')}}
function notify(text){clearTimeout(toastTimer);$('notice').textContent=text;$('notice').classList.add('show');toastTimer=setTimeout(()=>$('notice').classList.remove('show'),1400)}
function choose(i,now=performance.now()){if(!ready||now-last[i]<300)return false;last[i]=now;history.push(i);sync();const b=$('card'+i);clearTimeout(pulseTimers[i]);b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');pulseTimers[i]=setTimeout(()=>b.classList.remove('pulse'),310);notify('Таңдауың қабылданды!');queueSave();initAudio();play();return true}
LEVELS.forEach((l,i)=>{const b=document.createElement('button');b.type='button';b.id='card'+i;b.className='card '+l.cls;b.disabled=true;b.innerHTML=`<img src="${ASSETS[l.key]}" alt="" draggable="false"><h2>${l.title}</h2><p class="desc">${l.desc}</p><span class="counter">Таңдағандар: <b id="count${i}">0</b></span>`;b.onclick=()=>choose(i);$('cards').append(b);const row=document.createElement('article');row.className='row '+l.cls;row.innerHTML=`<img src="${ASSETS[l.key]}" alt=""><div><div class="rowHead"><h3>${l.title}</h3><span class="value" id="value${i}"></span></div><div class="track" id="track${i}" role="img"><div class="fill" id="fill${i}"></div></div></div>`;$('rows').append(row)});
$('result').onclick=()=>{$('choice').hidden=true;$('heading').hidden=true;$('results').hidden=false;sync();$('resultsTitle').focus()};$('back').onclick=()=>{$('results').hidden=true;$('heading').hidden=false;$('choice').hidden=false;$('result').focus()};
$('undo').onclick=()=>{if(!history.length)return;history.pop();last.fill(-Infinity);sync();queueSave();notify('Соңғы жауап қайтарылды')};
$('clear').onclick=()=>{if(!confirm('Барлық жауапты өшіріп, жаңадан бастайсыз ба?'))return;history=[];last.fill(-Infinity);sync();save();notify('Жауаптар тазартылды')};
$('sound').onclick=()=>{sound=!sound;updateSound();if(sound)initAudio();save()};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();$('fsNote').textContent=''}catch(e){$('fsNote').textContent='Толық экран үшін F11 батырмасын басыңыз'}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ Экраннан шығу':'⛶ Толық экран'});
document.addEventListener('pointerdown',initAudio,{once:true});document.addEventListener('keydown',initAudio,{once:true});window.addEventListener('pagehide',save);updateSound();sync();document.body.style.backgroundImage=`url("${ASSETS.background}")`;
Promise.all(Object.values(ASSETS).map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{(im.decode?im.decode():Promise.resolve()).then(resolve,resolve)};im.onerror=reject;im.src=src}))).then(()=>{ready=true;LEVELS.forEach((_,i)=>$('card'+i).disabled=false);$('loading').hidden=true}).catch(()=>{$('loading').textContent='Суреттерді оқу мүмкін болмады. Файлды қайта ашыңыз.'});
</script></html>
